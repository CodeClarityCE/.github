# The central repo's own CI: runs the Go library, Go image and Node image workflows
# against their fixtures, which also lints this repo's workflows.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-library:
    uses: $/.github/workflows/go-library.yml
    permissions:
      contents: write
    with:
      working-directory: fixtures/go-library

  # amd64 build only; release jobs stay skipped while CI_RELEASE is unset here.
  go-image:
    uses: $/.github/workflows/go-image.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      working-directory: fixtures/go-image

  # Same for the Node image fixture.
  node-image:
    uses: $/.github/workflows/node-image.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      working-directory: fixtures/node-image

  # Throwaway: version check of the Node fixture against the PR base.
  version-vs-base:
    uses: $/.github/workflows/version-check.yml
    permissions:
      contents: read
    with:
      version-file: fixtures/node-image/package.json
      base-branch: ci/102-node-image
      image: codeclarityce/fixture-node-image
      tag-prefix: v

  # The required check. Called workflow jobs show as "<caller> / <job>", so this one lives here.
  ci:
    needs: [go-library, go-image, node-image, version-vs-base]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"$NEEDS")
          [[ -z "$bad" ]] || { echo "::error::Did not succeed: $(tr '\n' ' ' <<<"$bad")"; exit 1; }
