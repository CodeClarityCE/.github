# The central repo's own CI: runs the Go library workflow against the fixture
# module, which also lints this repo's workflows.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-library:
    uses: $/.github/workflows/go-library.yml
    permissions:
      contents: write
    with:
      working-directory: fixtures/go-library

  version-vs-feature:
    uses: $/.github/workflows/version-check.yml
    permissions:
      contents: read
    with:
      version-file: fixtures/go-library/config.json
      base-branch: feat/ci-github-actions
      image: codeclarityce/fixture

  # The required check. Called workflow jobs show as "<caller> / <job>", so this one lives here.
  ci:
    needs: [go-library, version-vs-feature]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULT: ${{ needs.go-library.result == 'success' && needs.version-vs-feature.result || needs.go-library.result }}
        run: |
          echo "go-library: $RESULT"
          [[ "$RESULT" == success ]] || { echo "::error::go-library did not succeed: $RESULT"; exit 1; }
