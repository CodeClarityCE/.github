# The central repo's own CI: runs the Go library, Go image, Node image and Go fuzz workflows
# against their fixtures, which also lints this repo's workflows. The fixtures never
# release, so their version check is off and develop -> main PRs need no version bump.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-library:
    uses: $/.github/workflows/go-library.yml
    permissions:
      contents: write
    with:
      working-directory: fixtures/go-library
      version-check: false

  # amd64 build only; release jobs stay skipped while CI_RELEASE is unset here.
  # golangci-lint is on here and off in go-library, so both paths run.
  go-image:
    uses: $/.github/workflows/go-image.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Passed by name as every caller does; workflow lint checks it. Empty here, where nothing releases.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      working-directory: fixtures/go-image
      version-check: false
      golangci-lint: true

  # Same for the Node image fixture.
  node-image:
    uses: $/.github/workflows/node-image.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Passed by name as every caller does; workflow lint checks it. Empty here, where nothing releases.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      working-directory: fixtures/node-image
      version-check: false

  # The same fixture with the opt-in e2e job on; the call above leaves it off.
  node-image-e2e:
    uses: $/.github/workflows/node-image.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Passed by name as every caller does; workflow lint checks it. Empty here, where nothing releases.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      working-directory: fixtures/node-image
      version-check: false
      e2e-image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579

  # Finds and runs the Go library fixture's fuzz target briefly; only schedules open issues.
  go-fuzz:
    uses: $/.github/workflows/go-fuzz.yml
    permissions:
      contents: read
      issues: write
    with:
      working-directory: fixtures/go-library
      fuzz-time: 10s

  # The same over the Go image fixture's main package, as in plugins, where go list stamps VCS info.
  go-fuzz-main:
    uses: $/.github/workflows/go-fuzz.yml
    permissions:
      contents: read
      issues: write
    with:
      working-directory: fixtures/go-image
      fuzz-time: 10s

  # CodeQL over the fixtures and this repo's workflows; not in ci's needs, so findings never fail ci.
  codeql:
    uses: $/.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
    with:
      go-directory: fixtures/go-image
      javascript: true

  # Workflow lint's release-callers check: the good caller fixture passes, the broken one fails on each job.
  release-callers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # Keep in sync with workflow-lint.yml.
      YQ_IMAGE: mikefarah/yq:4.54.1@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Good caller passes
        run: bash scripts/release-callers.sh fixtures/release-callers/good
      - name: Broken caller fails on each job
        run: |
          status=0
          bash scripts/release-callers.sh fixtures/release-callers/broken >"$RUNNER_TEMP/out.txt" || status=$?
          # Indented so the expected errors do not become annotations of this run.
          sed 's/^/  /' "$RUNNER_TEMP/out.txt"
          if [[ "$status" == 0 ]]; then
            echo "::error::release-callers.sh passed the broken fixture"
            exit 1
          fi
          diff -u fixtures/release-callers/broken.expected "$RUNNER_TEMP/out.txt" | sed 's/^/  /' || true
          cmp -s fixtures/release-callers/broken.expected "$RUNNER_TEMP/out.txt" || {
            echo "::error::release-callers.sh output differs from fixtures/release-callers/broken.expected"
            exit 1
          }

  # The required check. Called workflow jobs show as "<caller> / <job>", so this one lives here.
  # Fails if any needed job failed or was cancelled; skipped counts as success.
  ci:
    needs:
      [
        go-library,
        go-image,
        node-image,
        node-image-e2e,
        go-fuzz,
        go-fuzz-main,
        release-callers,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            echo "::error::A needed job failed or was cancelled: $RESULTS"
            exit 1
          fi

  # Tracks a failing ci on pushes to main and develop in one issue per branch; not the required check.
  report:
    needs: [ci]
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.ci.result == 'success' || needs.ci.result == 'failure') }}
    uses: $/.github/workflows/ci-report.yml
    permissions:
      issues: write
      actions: read
    with:
      ci-result: ${{ needs.ci.result }}
