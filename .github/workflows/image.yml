# Builds a Docker image, or releases it to Docker Hub with a GitHub release.
# Shared by the Go image and Node image workflows.
#
# release false: amd64 build, not pushed, with the GitHub Actions layer cache.
# release true (main pushes with CI_RELEASE == 'true' only): skip if the tag exists,
# else build amd64 and arm64 natively, push by digest, merge into one manifest list
# tagged with the version and latest, attest provenance, then create the GitHub release.
name: Image

on:
  workflow_call:
    inputs:
      image:
        description: Docker Hub repository, such as codeclarityce/plugin-js-sbom.
        type: string
        required: true
      version:
        description: Version and git tag, such as v0.0.26-alpha. The Docker tag drops a leading v.
        type: string
        required: true
      target:
        description: Dockerfile build target.
        type: string
        default: plugin
      context:
        description: Docker build context, relative to the repo root.
        type: string
        default: .
      dockerfile:
        description: Dockerfile, relative to the context.
        type: string
        default: .cloud/docker/Dockerfile
      submodules:
        description: Checkout submodules value (false, true or recursive).
        type: string
        default: "false"
      release:
        description: Push and release instead of a local build.
        type: boolean
        default: false
    outputs:
      tag:
        description: Versioned image reference, such as codeclarityce/plugin-js-sbom:0.0.26-alpha.
        value: ${{ jobs.meta.outputs.tag }}
      released:
        description: true when this run pushed the image and created the release.
        value: ${{ jobs.release.outputs.released }}
      digest:
        description: Manifest list digest of the pushed image, empty unless released.
        value: ${{ jobs.merge.outputs.digest }}

permissions: {}

jobs:
  meta:
    name: image meta
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      docker-version: ${{ steps.meta.outputs.docker-version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - id: meta
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Values go into workflow commands and refs, so only allow plain characters.
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*$ ]] || { echo "::error::Unexpected image name: $IMAGE"; exit 1; }
          [[ "$VERSION" =~ ^[0-9A-Za-z.+_-]+$ ]] || { echo "::error::Unexpected version format: $VERSION"; exit 1; }
          prerelease=false
          if grep -q 'alpha\|beta' <<<"$VERSION"; then prerelease=true; fi
          {
            echo "docker-version=${VERSION#v}"
            echo "tag=$IMAGE:${VERSION#v}"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
      - id: exists
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          found=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" --jq "map(select(.ref == \"refs/tags/$VERSION\")) | length")
          if [[ "$found" != 0 ]]; then
            echo "Release $VERSION already exists, skipping image push and release"
            echo "Release \`$VERSION\` already exists, so no image was pushed and nothing was released." >>"$GITHUB_STEP_SUMMARY"
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

  build:
    name: image build
    needs: [meta]
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: linux/amd64
          push: false
          tags: ${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=image-${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=image-${{ inputs.target }}
      - name: Summary
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          TARGET: ${{ inputs.target || 'last stage' }}
        run: echo "Built \`$TAG\` (target \`$TARGET\`, linux/amd64), not pushed." >>"$GITHUB_STEP_SUMMARY"

  push:
    name: image push
    needs: [meta]
    if: inputs.release && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CI_RELEASE == 'true' && needs.meta.outputs.exists == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # No layer cache on release builds.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: image merge
    needs: [meta, push]
    if: inputs.release && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CI_RELEASE == 'true' && needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: merge
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ needs.meta.outputs.tag }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          [[ ${#sources[@]} == 2 ]] || { echo "::error::Expected 2 platform digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create -t "$TAG" -t "$IMAGE:latest" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -er .digest)
          docker buildx imagetools inspect "$TAG"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ inputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  # Runs only after the image is pushed, so a failed push leaves no release behind.
  release:
    name: github release
    needs: [meta, merge]
    if: inputs.release && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CI_RELEASE == 'true' && needs.meta.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          TAG: ${{ needs.meta.outputs.tag }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Release $VERSION" --generate-notes --prerelease="$PRERELEASE"
          echo "released=true" >>"$GITHUB_OUTPUT"
          {
            echo "### Released \`$VERSION\`"
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Image tags | \`$TAG\`, \`$IMAGE:latest\` |"
            echo "| Manifest digest | \`$DIGEST\` |"
            echo "| Prerelease | $PRERELEASE |"
          } >>"$GITHUB_STEP_SUMMARY"
