# CI for Node image repos (api, frontend): version check, checks in the Dockerfile's
# toolchain target, workflow lint, image build, and the gated release.
# Callers set concurrency and the top-level ci job; see README.md.
name: Node image

on:
  workflow_call:
    inputs:
      test-command:
        description: Unit test command, run in the toolchain container.
        type: string
        default: pnpm test
      extra-test-command:
        description: Optional second test command, such as api's contract e2e tests.
        type: string
        default: ""
      target:
        description: Dockerfile target for the image build. Empty builds the last stage.
        type: string
        default: ""
      working-directory:
        description: Directory holding package.json, used as the Docker build context.
        type: string
        default: .
      dockerfile:
        description: Dockerfile, relative to the working directory.
        type: string
        default: .cloud/docker/Dockerfile
      e2e-image:
        description: Digest-pinned Playwright image (mcr.microsoft.com/playwright:vX.Y.Z-noble@sha256:...) matching the repo's @playwright/test. Set it to run the e2e job; empty skips it.
        type: string
        default: ""
      e2e-command:
        description: Playwright command for the e2e job, run in the e2e image after pnpm install.
        type: string
        default: pnpm exec playwright test
      version-check:
        description: Fail PRs to main that do not bump the version. Off only for this repo's fixtures, which never release.
        type: boolean
        default: true
    # Passed on to image.yml for the release only.
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub user that pushes the image. Needed only when releasing.
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub access token for that user. Needed only when releasing.
        required: false

permissions: {}

jobs:
  meta:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.read.outputs.image }}
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        env:
          PACKAGE: ${{ inputs.working-directory }}/package.json
        run: |
          set -euo pipefail
          file="${PACKAGE#./}"
          name=$(jq -er .name "$PACKAGE") || { echo "::error file=$file::No name in package.json"; exit 1; }
          version=$(jq -er .version "$PACKAGE") || { echo "::error file=$file::No version in package.json"; exit 1; }
          [[ "$name" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo "::error file=$file::Package name must be a plain image name"; exit 1; }
          {
            echo "image=codeclarityce/$name"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  version:
    needs: [meta]
    if: inputs.version-check
    uses: $/.github/workflows/version-check.yml
    permissions:
      contents: read
    with:
      version-file: ${{ inputs.working-directory }}/package.json
      image: ${{ needs.meta.outputs.image }}
      tag-prefix: v

  checks:
    name: node checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PKG_DIR: ${{ inputs.working-directory }}
      TOOLCHAIN: node-toolchain:ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm reads minimumReleaseAge and allowBuilds from pnpm-workspace.yaml at the package root.
      - name: Stage pnpm config
        working-directory: ${{ inputs.working-directory }}
        run: cp .cloud/docker/pnpm-workspace.yaml pnpm-workspace.yaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile }}
          target: toolchain
          load: true
          tags: ${{ env.TOOLCHAIN }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
      # Main pushes, which may release, do not read the cache; zizmor can't see that.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning]
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: pnpm-store-
      # toolchain-run runs a shell command in the toolchain container as the runner user.
      - name: Set up toolchain runner
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/ci-home" "$RUNNER_TEMP/pnpm-store"
          cat >"$RUNNER_TEMP/bin/toolchain-run" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -u "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE/$PKG_DIR" -e HOME="$RUNNER_TEMP/ci-home" -e CI=true \
            "$TOOLCHAIN" sh -ec "$1"
          EOF
          chmod +x "$RUNNER_TEMP/bin/toolchain-run"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: pnpm install
        run: toolchain-run "pnpm install --frozen-lockfile --store-dir $RUNNER_TEMP/pnpm-store"
      - name: Lint
        run: toolchain-run 'pnpm lint:check'
      - name: Type-check
        run: toolchain-run 'pnpm type-check'
      - name: Unit tests
        env:
          CMD: ${{ inputs.test-command }}
        run: toolchain-run "$CMD"
      - name: Extra tests
        if: inputs.extra-test-command != ''
        env:
          CMD: ${{ inputs.extra-test-command }}
        run: toolchain-run "$CMD"
      - name: Prettier
        # Runs even when the tests fail, so formatting is reported too.
        if: ${{ !cancelled() }}
        run: |
          set +e
          out=$(toolchain-run 'pnpm exec prettier src --check --no-color' 2>&1)
          status=$?
          echo "$out"
          if [[ $status != 0 ]]; then
            prefix="${PKG_DIR#./}"; prefix="${prefix#.}"; prefix="${prefix:+${prefix%/}/}"
            grep '^\[warn\] ' <<<"$out" | grep -v 'Code style issues' | sed 's/^\[warn\] //' | while IFS= read -r f; do
              echo "::error file=$prefix$f::$f is not Prettier-formatted"
            done
            echo "Run prettier --write on the files above"
          fi
          exit $status

  # Opt-in: runs only when the caller sets e2e-image.
  e2e:
    name: e2e
    if: inputs.e2e-image != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PKG_DIR: ${{ inputs.working-directory }}
      E2E_IMAGE: ${{ inputs.e2e-image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the image is pinned by digest
        run: |
          [[ "$E2E_IMAGE" =~ ^[^@[:space:]]+:[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::e2e-image must be <image>:<tag>@sha256:<digest>, got: $E2E_IMAGE"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage pnpm config
        working-directory: ${{ inputs.working-directory }}
        run: cp .cloud/docker/pnpm-workspace.yaml pnpm-workspace.yaml
      # Its own key: the Playwright image is glibc, the toolchain image musl.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning]
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-e2e-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: pnpm-store-e2e-
      # Root in the container, since corepack enable writes to /usr/local/bin; files go back to the runner user.
      - name: Playwright
        env:
          CMD: ${{ inputs.e2e-command }}
          # corepack 0.36.0 for npm ci, which installs it only when its sha512 matches.
          COREPACK_PACKAGE: '{"private":true,"dependencies":{"corepack":"0.36.0"}}'
          COREPACK_LOCK: '{"lockfileVersion":3,"requires":true,"packages":{"":{"dependencies":{"corepack":"0.36.0"}},"node_modules/corepack":{"version":"0.36.0","resolved":"https://registry.npmjs.org/corepack/-/corepack-0.36.0.tgz","integrity":"sha512-SiiJsBhZqdBiPHTEl6OT3sASrRrKIcYTQMsVGXx6EE/gM8WFMwYjeIX8Tt8RiU4Iv2J6LbT8KpGfCOsBpRWB/w==","bin":{"corepack":"dist/corepack.js","pnpm":"dist/pnpm.js","pnpx":"dist/pnpx.js","yarn":"dist/yarn.js","yarnpkg":"dist/yarnpkg.js"}}}}'
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-store"
          docker run --rm --ipc=host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE/$PKG_DIR" -e CI=true -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0 \
            -e CMD -e COREPACK_PACKAGE -e COREPACK_LOCK -e WS="$GITHUB_WORKSPACE" -e STORE="$RUNNER_TEMP/pnpm-store" -e OWNER="$(id -u):$(id -g)" \
            "$E2E_IMAGE" bash -ec '
              restore() { chown -R "$OWNER" "$WS" "$STORE"; }
              trap restore EXIT
              mkdir /tmp/corepack
              printf "%s\n" "$COREPACK_PACKAGE" >/tmp/corepack/package.json
              printf "%s\n" "$COREPACK_LOCK" >/tmp/corepack/package-lock.json
              npm ci --prefix /tmp/corepack --ignore-scripts --no-audit --no-fund >/dev/null
              /tmp/corepack/node_modules/.bin/corepack enable --install-directory /usr/local/bin
              pnpm install --frozen-lockfile --store-dir "$STORE"
              eval "$CMD"
            '
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            ${{ inputs.working-directory }}/playwright-report/
            ${{ inputs.working-directory }}/test-results/
          if-no-files-found: warn
          retention-days: 14

  lint:
    uses: $/.github/workflows/workflow-lint.yml
    permissions:
      contents: read

  # PRs, develop, and main while CI_RELEASE is off: amd64 build, not pushed.
  build:
    needs: [meta]
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CI_RELEASE == 'true') }}
    uses: $/.github/workflows/image.yml
    # GitHub checks these for the skipped release jobs in image.yml too; the build job only reads.
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      image: ${{ needs.meta.outputs.image }}
      version: v${{ needs.meta.outputs.version }}
      target: ${{ inputs.target }}
      context: ${{ inputs.working-directory }}
      dockerfile: ${{ inputs.dockerfile }}

  # e2e may be skipped, which would skip a plain needs chain, so results are checked by hand.
  release:
    needs: [meta, checks, lint, e2e]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CI_RELEASE == 'true'
      && needs.meta.result == 'success' && needs.checks.result == 'success' && needs.lint.result == 'success'
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    uses: $/.github/workflows/image.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      image: ${{ needs.meta.outputs.image }}
      version: v${{ needs.meta.outputs.version }}
      target: ${{ inputs.target }}
      context: ${{ inputs.working-directory }}
      dockerfile: ${{ inputs.dockerfile }}
      release: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Fails if any needed job failed or was cancelled; skipped counts as success.
  ci:
    needs: [meta, version, checks, lint, e2e, build, release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            echo "::error::A needed job failed or was cancelled: $RESULTS"
            exit 1
          fi
