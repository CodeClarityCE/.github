# Go checks in the pinned Go image: download, tidy, gofmt, vet, opt-in golangci-lint, test, govulncheck.
# Shared by the Go library and Go image workflows.
name: Go checks

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding go.mod, relative to the repo root.
        type: string
        default: .
      gowork-off:
        description: Set GOWORK=off, as the image build does.
        type: boolean
        default: false
      submodules:
        description: Checkout submodules value (false, true or recursive).
        type: string
        default: "false"
      golangci-lint:
        description: Run golangci-lint with this repo's shared .golangci.yml (unused, staticcheck, gosec).
        type: boolean
        default: false

permissions: {}

jobs:
  checks:
    name: go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Keep in sync with the Dockerfiles and go.mod.
    container:
      image: golang:1.27.4@sha256:5e8afd493a7124a8586e134d9b532731161d4b9becf9dee5a5956b107426f93d
    env:
      GOTOOLCHAIN: local
      GOPRIVATE: github.com/CodeClarityCE/*
      GOWORK: ${{ inputs.gowork-off && 'off' || '' }}
      MODULE_DIR: ${{ inputs.working-directory }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      # Annotation path prefix for the module dir: "" for the root, else "dir/".
      - name: Annotation prefix
        id: prefix
        run: |
          prefix="${MODULE_DIR#./}"; prefix="${prefix#.}"; prefix="${prefix:+${prefix%/}/}"
          echo "prefix=$prefix" >>"$GITHUB_OUTPUT"
      - name: go mod download
        run: go mod download
      - name: go mod tidy
        env:
          FILE_PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: |
          go mod tidy -diff || {
            echo "::error file=${FILE_PREFIX}go.mod::go.mod or go.sum is not tidy. Run go mod tidy and commit the result."
            exit 1
          }
      - name: gofmt
        env:
          FILE_PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: |
          files=$(gofmt -l .)
          if [[ -n "$files" ]]; then
            while IFS= read -r f; do
              echo "::error file=$FILE_PREFIX$f::$f is not gofmt-formatted"
            done <<<"$files"
            echo "Run gofmt -w on the files above"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        if: inputs.golangci-lint
        env:
          FILE_PREFIX: ${{ steps.prefix.outputs.prefix }}
          # The config comes from this workflow's own commit, so a caller on v1 gets v1's config.
          CONFIG_REPO: ${{ job.workflow_repository }}
          CONFIG_SHA: ${{ job.workflow_sha }}
          # Keep in sync with the version in README.md.
          GOLANGCI_LINT: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/golangci.yml" \
            "https://raw.githubusercontent.com/$CONFIG_REPO/$CONFIG_SHA/.golangci.yml"
          status=0
          go run "$GOLANGCI_LINT" run --config "$RUNNER_TEMP/golangci.yml" \
            --output.text.print-issued-lines=false --output.text.colors=false ./... >"$RUNNER_TEMP/golangci.txt" || status=$?
          cat "$RUNNER_TEMP/golangci.txt"
          # One annotation per finding; paths in the output are relative to go.mod.
          re='^([^:]+\.go):([0-9]+):([0-9]+): (.*)$'
          while IFS= read -r line; do
            if [[ "$line" =~ $re ]]; then
              echo "::error file=$FILE_PREFIX${BASH_REMATCH[1]},line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[4]}"
            fi
          done <"$RUNNER_TEMP/golangci.txt"
          exit "$status"
      - name: go test
        run: go test -v ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
