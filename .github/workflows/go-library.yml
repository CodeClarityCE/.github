# CI for Go library repos: version check, Go checks, workflow lint and release.
# Callers set concurrency and the top-level ci job; see README.md.
name: Go library

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding go.mod and config.json, relative to the repo root.
        type: string
        default: .

permissions: {}

jobs:
  version:
    uses: $/.github/workflows/version-check.yml
    permissions:
      contents: read
    with:
      version-file: ${{ inputs.working-directory }}/config.json

  checks:
    name: go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Keep in sync with the Dockerfiles and go.mod.
    container:
      image: golang:1.27.3@sha256:2920bb124f1a2e12a1d39f0cab756ae0068441ee1da7655dec7f5e374944095b
    env:
      GOTOOLCHAIN: local
      GOPRIVATE: github.com/CodeClarityCE/*
      MODULE_DIR: ${{ inputs.working-directory }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: go mod download
        run: go mod download
      - name: go mod tidy
        run: |
          go mod tidy -diff || {
            echo "::error file=${MODULE_DIR#./}/go.mod::go.mod or go.sum is not tidy. Run go mod tidy and commit the result."
            exit 1
          }
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [[ -n "$files" ]]; then
            prefix="${MODULE_DIR#./}"; prefix="${prefix#.}"; prefix="${prefix:+${prefix%/}/}"
            while IFS= read -r f; do
              echo "::error file=$prefix$f::$f is not gofmt-formatted"
            done <<<"$files"
            echo "Run gofmt -w on the files above"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -v ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  lint:
    uses: $/.github/workflows/workflow-lint.yml
    permissions:
      contents: read

  release:
    needs: [checks, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CI_RELEASE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_FILE: ${{ inputs.working-directory }}/config.json
        run: |
          set -euo pipefail
          version=$(jq -er .version "$VERSION_FILE")
          [[ "$version" =~ ^[0-9A-Za-z.+_-]+$ ]] || { echo "::error::Unexpected version format: $version"; exit 1; }
          found=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$version" --jq "map(select(.ref == \"refs/tags/$version\")) | length")
          if [[ "$found" != 0 ]]; then
            echo "Tag $version already exists, nothing to release"
            echo "Tag \`$version\` already exists, nothing released." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          prerelease=false
          if grep -q 'alpha\|beta' <<<"$version"; then prerelease=true; fi
          gh release create "$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Release $version" --generate-notes --prerelease="$prerelease"
          echo "Released \`$version\` at \`$GITHUB_SHA\` (prerelease: $prerelease)." >>"$GITHUB_STEP_SUMMARY"

  # Fails if any job failed or was cancelled; skipped jobs count as success.
  ci:
    needs: [version, checks, lint, release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [[ -n "$bad" ]]; then
            echo "::error::Jobs did not succeed: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
