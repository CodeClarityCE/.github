# A caller that can release: both Docker Hub secrets by name and the three write permissions.
name: CI

on:
  pull_request:

permissions: {}

jobs:
  go:
    uses: CodeClarityCE/.github/.github/workflows/go-image.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  node:
    uses: $/.github/workflows/node-image.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Other reusable workflows are not checked.
  lib:
    uses: CodeClarityCE/.github/.github/workflows/go-library.yml@v1
    permissions:
      contents: write
